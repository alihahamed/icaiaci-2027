<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICAIACI–2027 · Yenepoya Institute of Technology</title>
<meta name="description" content="International Conference on Artificial Intelligence and Advanced Computational Intelligence, 28–29 January 2027, Yenepoya Institute of Technology, Moodbidri, Karnataka, India.">
<meta name="theme-color" content="#f8f6f1">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #f8f6f1;
  --ink-2: #efece4;
  --ink-3: #ffffff;
  --line: rgba(16, 32, 72, .12);
  --text: #0d1838;
  --muted: #56617c;
  --gold: #9c6206;
  --gold-fill: #e8a92c;
  --gold-soft: rgba(232, 169, 44, .16);
  --blue: #1f5fd6;
  --cyan: #0b7fa6;
  --serif: "Instrument Serif", Georgia, serif;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --wrap: min(1180px, 100% - 2rem);
}
* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 5rem; }
body { background: var(--ink); color: var(--text); font: 400 1rem/1.65 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
img { max-width: 100%; display: block; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 4px; }
.wrap { width: var(--wrap); margin-inline: auto; }
.mono { font-family: var(--mono); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }
.gold { color: var(--gold); }
.skip { position: absolute; left: -999px; top: 0; background: var(--gold-fill); color: var(--text); padding: .5rem 1rem; z-index: 99; }
.skip:focus { left: 1rem; }

/* nav */
header { position: sticky; top: 0; z-index: 50; backdrop-filter: blur(14px); background: rgba(248, 246, 241, .82); border-bottom: 1px solid var(--line); }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 1rem; height: 4.25rem; }
.brand { display: flex; align-items: center; gap: .7rem; text-decoration: none; font-weight: 600; letter-spacing: .02em; }
.brand img { width: 40px; height: 40px; border-radius: 50%; clip-path: circle(50%); }
.brand small { display: block; font: 400 .7rem var(--mono); color: var(--muted); letter-spacing: .06em; }
.nav ul { display: flex; gap: 1.6rem; list-style: none; padding: 0; }
.nav ul a { text-decoration: none; font-size: .9rem; color: var(--muted); transition: color .2s; }
.nav ul a:hover, .nav ul a.active { color: var(--text); }
.btn { display: inline-flex; align-items: center; gap: .5rem; padding: .75rem 1.25rem; border-radius: 999px; font: 500 .92rem var(--sans); text-decoration: none; border: 1px solid var(--line); transition: transform .2s, background .2s, border-color .2s; }
.btn:hover { transform: translateY(-2px); border-color: rgba(232,169,44,.5); }
.btn-gold { background: var(--gold-fill); color: var(--text); border-color: var(--gold-fill); }
.btn-gold:hover { background: #f5bb46; }
.menu-btn { display: none; background: none; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: .45rem .6rem; cursor: pointer; }














</style>
</head>
<body>

</body>
